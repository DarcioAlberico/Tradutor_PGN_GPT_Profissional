[project]
name = "pgn-tradutor-pro"
version = "0.3.0"  # espelha tradutor_pgn/__version__ (um teste guarda os dois)
description = "Aplicacao para traduzir comentarios PGN com cache SQLite e glossario."
readme = "README.md"
requires-python = ">=3.10"  # o codigo roda em 3.13 (.python-version); 3.8 nunca foi testado
dependencies = [
    "chardet>=5.2",
    "customtkinter>=5.2",
    "requests>=2.32",
    # Motor hunspell do corretor de prosa (ROADMAP 26). Estava so no
    # requirements.txt: `uv sync` abria o programa sem corretor (ROADMAP 28.1).
    "spylls>=0.1.7",
]

# O tabuleiro do editor (ROADMAP 28.8) e OPCIONAL, e por licenca: python-chess
# e GPL-3.0-ou-posterior, e o programa nao muda de licenca por um quadro de
# conforto. Sem o pacote nada quebra — o worker pula o calculo das posicoes e o
# editor nao mostra o quadro. O `.spec` do PyInstaller o exclui de proposito.
#   uv sync --extra tabuleiro   /   python -m pip install chess
[project.optional-dependencies]
tabuleiro = ["chess>=1.11"]
# O SDK da Anthropic, para o motor Claude (ROADMAP 28.7). ChatGPT e DeepSeek
# falam por `requests` e nao precisam de nada. Opcional pelo mesmo motivo do
# tabuleiro: quem so usa o Google nao o carrega, e o `.exe` so o leva se o
# ambiente do build o tiver.
llm = ["anthropic>=1.0"]

# So para desenvolver e para o CI: a suite roda com `pytest` (tambem roda com
# `unittest`, mas o CI quer o `-q` e o resumo dele) e o lint com `ruff`. O `uv
# sync` instala o grupo `dev` por padrao; o `.exe` nao os leva.
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-requests"]

# Tipos (ROADMAP 28.11): comecando por `translation_api` e `database`, nao
# bloqueante. So os modulos listados sao conferidos; os outros entram quando
# ganharem anotacoes, e `ignore_missing_imports` cobre o customtkinter e o
# chess, que nao trazem stubs.
[tool.mypy]
files = [
    "tradutor_pgn/translation_api.py",
    "tradutor_pgn/database.py",
    "tradutor_pgn/word_count.py",
    "tradutor_pgn/api_keys.py",
    "tradutor_pgn/llm_prompt.py",
    "tradutor_pgn/llm_providers.py",
    "tradutor_pgn/llm_costs.py",
]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
# So os modulos listados: anotados inteiros, e cada funcao nova neles tem de
# chegar anotada. O resto do pacote e seguido para resolver tipos, sem ser cobrado.
follow_imports = "silent"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.uv]
package = false

[tool.ruff.lint]
# O que rodava por padrao ate o ruff 0.15 (E4, E7, E9, F), agora ESCRITO: o
# 0.16 trocou o conjunto padrao por um bem maior (BLE, DTZ, RUF, S, I...) e o
# `uv sync` de um CI novo o instalaria — 272 apontamentos que ninguem pediu,
# de uma vez. E741 (`l` como nome de variavel) fica permitido so nos testes,
# onde sobraram 15 lacos `for l in ...` que nao valem uma rodada de renomeacao.
select = ["E4", "E7", "E9", "F"]
per-file-ignores = { "tests/*" = ["E741"] }
