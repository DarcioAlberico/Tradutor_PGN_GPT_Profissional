[project]
name = "pgn-tradutor-pro"
version = "0.3.0"  # espelha tradutor_pgn/__version__ (um teste guarda os dois)
description = "Aplicacao para traduzir comentarios PGN com cache SQLite e glossario."
readme = "README.md"
requires-python = ">=3.10"  # o codigo roda em 3.13 (.python-version); 3.8 nunca foi testado
dependencies = [
    "chardet>=5.2",
    "customtkinter>=5.2",
    "requests>=2.32",
    # Motor hunspell do corretor de prosa (ROADMAP 26). Estava so no
    # requirements.txt: `uv sync` abria o programa sem corretor (ROADMAP 28.1).
    "spylls>=0.1.7",
]

[tool.uv]
package = false

[tool.ruff.lint]
# O que ja rodava por padrao (E4, E7, E9, F), agora escrito. E741 (`l` como
# nome de variavel) fica permitido so nos testes, onde sobraram 15 lacos
# `for l in ...` que nao valem uma rodada de renomeacao.
per-file-ignores = { "tests/*" = ["E741"] }
